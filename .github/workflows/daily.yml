name: RSI 다이버전스 데일리

on:
  schedule:
    - cron: "17 0 * * *"   # 매일 09:17 KST 실행 (GitHub 스케줄은 수~수십 분 늦게 시작할 수 있음)
    - cron: "47 0 * * *"   # 09:47 KST 재시도 — 이미 발행됐으면 자동으로 건너뜀
  workflow_dispatch:
    inputs:
      mode:
        description: "check=키 점검 / preview=영상만 생성(업로드 X) / publish=지금 생성+업로드"
        type: choice
        options: [preview, check, publish]
        default: preview
      demo:
        description: "합성 데이터로 미리보기 (실제 시세 사용 안 함)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: rsi-daily
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
  GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
  GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
  BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
  COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
  CHANNEL_NAME: ${{ vars.CHANNEL_NAME }}
  TTS_VOICE: ${{ vars.TTS_VOICE }}
  YT_PRIVACY: ${{ vars.YT_PRIVACY }}
  IMAGE_MODE: ${{ vars.IMAGE_MODE }}
  OVERSOLD: ${{ vars.OVERSOLD }}
  # 예약 실행 또는 mode=publish 일 때만 업로드
  DO_PUBLISH: ${{ github.event_name == 'schedule' || (inputs.mode == 'publish' && !inputs.demo) }}

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 한글 폰트 · ffmpeg 설치
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk ffmpeg

      - name: 파이썬 패키지 설치
        run: pip install -r requirements.txt

      - name: 키 점검
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check'
        run: python -m rsi_daily check

      - name: 생성 (스캔 → 차트 → 영상)
        id: build
        if: github.event_name == 'schedule' || inputs.mode != 'check'
        run: python -m rsi_daily build ${{ inputs.demo && '--demo' || '' }} ${{ inputs.mode == 'preview' && '--force' || '' }}

      - name: 미리보기 파일 보관 (실행 결과 화면 하단 Artifacts)
        if: steps.build.outcome == 'success' && steps.build.outputs.skip != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: preview-${{ steps.build.outputs.run_date }}
          path: |
            out/*.mp4
            out/manifest.json
            docs/posts/
          retention-days: 7

      - name: 블로그 이미지 커밋
        if: env.DO_PUBLISH == 'true' && steps.build.outputs.skip == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/posts state
          git commit -q -m "images ${{ steps.build.outputs.run_date }}" || echo "변경 없음"
          git push

      - name: 업로드 (YouTube 예약 공개 + Blogger 예약 발행)
        id: publish
        if: env.DO_PUBLISH == 'true' && steps.build.outputs.skip == 'false'
        run: python -m rsi_daily publish

      - name: 발행 기록 저장
        if: always() && env.DO_PUBLISH == 'true' && steps.build.outputs.skip == 'false'
        run: |
          git add state
          git commit -q -m "publish log ${{ steps.build.outputs.run_date }}" || echo "변경 없음"
          git pull -q --rebase || true
          git push
